<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta do Tormento</title>

    <link rel="stylesheet" href="css/css-floresta-inicio.css">
</head>
<body>
<div class="background"></div>
<div class="overlay"></div>

<div class="container">

    <header class="top-bar">

        <div class="status-item">
            <span class="icon">❤️</span>
            <div class="status-info">
                <span class="label" id="vida">Vida: 100/100</span>

                <div class="bar">
                    <div class="fill vida" id="barra-vida"></div>
                </div>
            </div>
        </div>

        <div class="status-item">
            <span class="icon">🪙</span>
            <span class="label" id="dinheiro">Dinheiro: 250</span>
        </div>

        <div class="status-item">
            <span class="icon">👑</span>

            <div class="status-info">
                <span class="label" id="rank">Rank: Iniciante</span>

                <div class="bar">
                    <div class="fill rank" id="barra-xp"></div>
                </div>
            </div>
        </div>
    </header>
    <section class="intro">
        <h1>Floresta do Tormento</h1>
        <div class="divider">
            <span></span>◆<span></span>
        </div>
        <p>
            Uma floresta nada segura para aventureiros.
            Aqui você pode se perder e morrer a qualquer momento,
            em um lugar longe de qualquer cidade.
        </p>
    </section>

    <main class="content">
        <aside class="player-card">

            <div class="player-image-container">

                <img
                        src="img/player-guerreiro.jpg"
                        alt="Tharion"
                        class="player-img">
            </div>
            <div class="player-info">
                <h2>Tharion</h2>
                <span class="player-class">
                    Guerreiro
                </span>
                <div class="player-divider"></div>
                <div class="stats">
                    <div>
                        <span >Vida:</span>
                        <strong id="card-player-vida">100/100</strong>
                    </div>
                    <div>
                        <span>Dano:</span>
                        <strong id="card-player-dano">25</strong>
                    </div>
                    <div>
                        <span>Defesa:</span>
                        <strong id="card-player-defesa">30</strong>
                    </div>
                    <div>
                        <span>Rank:</span>
                        <strong id="card-player-rank">Iniciante</strong>
                    </div>
                </div>
            </div>
        </aside>

        <section class="menu-grid">

            <button type="button" class="menu-card floresta-card">
                <div class="card-overlay"></div>

                <div class="card-content">
                    <div class="card-icon">⚔</div>

                    <h2>Procurar na floresta</h2>

                    <p>
                        Enfrente monstros, encontre recursos
                        e ganhe experiência.
                    </p>
                </div>

                <span class="arrow">❯</span>
            </button>


            <button type="button" class="menu-card loja-card">
                <div class="card-overlay"></div>

                <div class="card-content">
                    <div class="card-icon">🪙</div>

                    <h2>Loja</h2>

                    <p>
                        Compre poções e equipamentos
                        para continuar sua jornada.
                    </p>
                </div>

                <span class="arrow">❯</span>
            </button>


            <button type="button" class="menu-card inventario-card">
                <div class="card-overlay"></div>

                <div class="card-content">
                    <div class="card-icon">🎒</div>

                    <h2>Inventário</h2>

                    <p>
                        Veja seus itens,
                        equipamentos e recursos.
                    </p>
                </div>

                <span class="arrow">❯</span>
            </button>


            <button type="button" class="menu-card descansar-card">
                <div class="card-overlay"></div>

                <div class="card-content">
                    <div class="card-icon">🔥</div>

                    <h2>Descansar</h2>

                    <p>
                        Recupere sua vida e
                        prepare-se para novos desafios.
                    </p>
                </div>

                <span class="arrow">❯</span>
            </button>

        </section>
    </main>
</div>

<script src="js/menu_jogo.js"></script>
</body>
</html>
